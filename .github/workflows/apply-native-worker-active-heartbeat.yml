name: apply-native-worker-active-heartbeat

on:
  push:
    branches:
      - codex/native-telegram-worker
    paths:
      - scripts/_patch_native_worker_active_heartbeat_once.py
      - .github/workflows/apply-native-worker-active-heartbeat.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-telegram-worker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply active heartbeat patch
        run: |
          python scripts/_patch_native_worker_active_heartbeat_once.py
          git diff --check
      - name: Commit active heartbeat
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_dispatcher/native_telegram_worker.py
          git commit -m "feat: emit active native worker heartbeat"
          git push origin HEAD:codex/native-telegram-worker
