name: apply-secret-tool-fail-closed

on:
  pull_request:
    paths:
      - scripts/_patch_secret_tool_fail_closed_once.py
      - .github/workflows/apply-secret-tool-fail-closed.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact fail-closed patch
        run: |
          python scripts/_patch_secret_tool_fail_closed_once.py
          git diff --check
          python -m py_compile history_dispatcher/telegram_secrets.py
      - name: Commit fail-closed handling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_dispatcher/telegram_secrets.py
          git commit -m "fix: fail closed on Secret-Service backend errors"
          git push origin HEAD:${{ github.head_ref }}
