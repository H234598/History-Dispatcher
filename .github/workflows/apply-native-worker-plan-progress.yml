name: apply-native-worker-plan-progress

on:
  push:
    branches:
      - codex/native-telegram-worker
    paths:
      - scripts/_patch_native_worker_plan_progress_once.py
      - .github/workflows/apply-native-worker-plan-progress.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-telegram-worker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact plan progress patch
        run: |
          python scripts/_patch_native_worker_plan_progress_once.py
          git diff --check
      - name: Commit plan progress
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-07-31-native-telegram-worker.md docs/implementation-progress.md
          git commit -m "docs: update native Telegram worker progress"
          git push origin HEAD:codex/native-telegram-worker
