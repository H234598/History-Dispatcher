name: apply-native-worker-docs

on:
  push:
    branches:
      - codex/native-telegram-worker
    paths:
      - scripts/_patch_native_worker_docs_once.py
      - .github/workflows/apply-native-worker-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-telegram-worker
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact documentation patch
        run: |
          python scripts/_patch_native_worker_docs_once.py
          git diff --check
      - name: Commit documentation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs
          git commit -m "docs: complete native Telegram worker contract"
          git push origin HEAD:codex/native-telegram-worker
