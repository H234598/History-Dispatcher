name: apply-native-worker-merge-evidence

on:
  push:
    branches:
      - codex/native-telegram-worker-plan-sync
    paths:
      - scripts/_patch_native_worker_merge_evidence_once.py
      - .github/workflows/apply-native-worker-merge-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/native-telegram-worker-plan-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact merge evidence patch
        run: |
          python scripts/_patch_native_worker_merge_evidence_once.py
          git diff --check
      - name: Commit merge evidence
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: close native Telegram worker plan"
          git push origin HEAD:codex/native-telegram-worker-plan-sync
