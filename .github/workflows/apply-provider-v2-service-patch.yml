name: apply-provider-v2-service-patch

on:
  pull_request:
    paths:
      - scripts/_patch_provider_v2_service_once.py
      - .github/workflows/apply-provider-v2-service-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact one-time provider v2 patch
        run: |
          python scripts/_patch_provider_v2_service_once.py
          git diff --check
          python -m compileall -q history_dispatcher tests
      - name: Commit provider v2 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_dispatcher/idempotency.py history_dispatcher/service.py tests/test_architecture_contract.py
          git commit -m "feat: expose provider v2 worker API"
          git push origin HEAD:${{ github.head_ref }}
