name: apply-native-credentials-final-evidence

on:
  pull_request:
    paths:
      - scripts/_patch_native_credentials_final_evidence_once.py
      - .github/workflows/apply-native-credentials-final-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact evidence patch
        run: |
          python scripts/_patch_native_credentials_final_evidence_once.py
          git diff --check
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-07-31-native-telegram-credentials.md docs/implementation-progress.md
          git commit -m "docs: record native credential verification evidence"
          git push origin HEAD:${{ github.head_ref }}
