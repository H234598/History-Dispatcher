name: apply-delivery-store-patch

on:
  pull_request:
    paths:
      - scripts/_patch_delivery_store_once.py
      - .github/workflows/apply-delivery-store-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact one-time source patch
        run: |
          python scripts/_patch_delivery_store_once.py
          git diff --check
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_dispatcher/delivery_store.py
          git commit -m "fix: harden delivery store retries"
          git push origin HEAD:${{ github.head_ref }}
