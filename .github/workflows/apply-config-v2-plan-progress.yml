name: apply-config-v2-plan-progress

on:
  pull_request:
    paths:
      - scripts/_patch_config_v2_plan_progress_once.py
      - .github/workflows/apply-config-v2-plan-progress.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact plan progress patch
        run: |
          python scripts/_patch_config_v2_plan_progress_once.py
          git diff --check
      - name: Commit plan progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-07-31-config-v2-writer.md
          git commit -m "docs: record Config v2 plan progress"
          git push origin HEAD:${{ github.head_ref }}
